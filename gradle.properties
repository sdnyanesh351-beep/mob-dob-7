# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true -Dawt.toolkit=sun.awt.HeadlessToolkit -Djava.awt.graphicsenv=sun.java2d.NullSurfaceDataFactory -Didea.ignore.disabled.plugins=true -Didea.initially.ask.config=never -Djb.consents.confirmation.enabled=false -Didea.platform.prefix=Idea -Dio.netty.leakDetection.level=disabled

kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.awt.headless=true -Dawt.toolkit=sun.awt.HeadlessToolkit -Didea.ignore.disabled.plugins=true -Didea.initially.ask.config=never -Djb.consents.confirmation.enabled=false -Didea.platform.prefix=Idea
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
# NOTE: Disabled configuration-cache on Android + JDK21 + compileSdk 36.1
# because AGP's JdkImageTransform writes TransformBackedProvider fields
# that cannot be serialized at store-time (see
# :app:compileDebugJavaWithJavac -> generatedModuleFile error).
# Fallback to the legacy build-cache; this is still very fast with incremental.
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# Set the Kotlin compiler execution strategy to in-process to avoid "Could not
# connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process
# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Force Gradle to use the local JDK 17 (has jlink.exe) instead of VS Code JRE
org.gradle.java.home=C:/Program Files/Java/jdk-17
